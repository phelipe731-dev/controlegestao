services:
  db:
    image: postgres:16-alpine
    container_name: campanha-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campanha_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/phelipe731-dev/controlegestao-backend:latest}
    container_name: campanha-backend
    restart: unless-stopped
    depends_on:
      - db
      - waha
    environment:
      PORT: 3333
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-campanha_db}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-false}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-campanhahub}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      WAHA_API_URL: ${WAHA_API_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_WEBHOOK_URL: ${WAHA_WEBHOOK_URL:-}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:-}
    ports:
      - 127.0.0.1:${API_PORT:-3333}:3333
    volumes:
      - uploads_data:/app/uploads

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/phelipe731-dev/controlegestao-frontend:latest}
    container_name: campanha-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-5173}:80

  waha:
    image: devlikeapro/waha:latest
    container_name: campanha-waha
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WAHA_CLIENT_DEVICE_NAME: CampanhaHub
      WAHA_CLIENT_BROWSER_NAME: Chrome
    ports:
      - 127.0.0.1:${WAHA_PORT:-3000}:3000
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  postgres_data:
  uploads_data:
  waha_sessions:
